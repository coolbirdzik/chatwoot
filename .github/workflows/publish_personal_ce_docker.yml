name: Publish Personal Chatwoot CE Docker Image

on:
  push:
    tags:
      - 'v*-ce'
  workflow_dispatch:
    inputs:
      docker_tag:
        description: Optional Docker tag override. Defaults to the current git tag or branch name.
        required: false
        type: string
      push_latest_ce:
        description: Also publish the image as latest-ce.
        required: false
        default: false
        type: boolean

env:
  DOCKER_REPO: coolbirdzik/chatwoot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Compute Docker tags
        id: tags
        env:
          INPUT_TAG: ${{ github.event.inputs.docker_tag }}
          PUSH_LATEST_CE: ${{ github.event.inputs.push_latest_ce }}
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            PRIMARY_TAG="$INPUT_TAG"
          else
            PRIMARY_TAG=$(echo "$GIT_REF" | sed 's/\//-/g')
          fi

          TAGS="${DOCKER_REPO}:${PRIMARY_TAG}"

          if [ "$PUSH_LATEST_CE" = "true" ]; then
            TAGS="${TAGS},${DOCKER_REPO}:latest-ce"
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "primary_tag=$PRIMARY_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push CE image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Image summary
        run: |
          echo "Published ${DOCKER_REPO}:${{ steps.tags.outputs.primary_tag }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.push_latest_ce }}" = "true" ]; then
            echo "Published ${DOCKER_REPO}:latest-ce" >> "$GITHUB_STEP_SUMMARY"
          fi
